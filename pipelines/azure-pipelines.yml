# Run CI for changes to the main branch and pull requests targeting it.
trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

# Use a Microsoft-hosted Linux agent and a consistent build configuration.
pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release

stages:
  # Restore NuGet dependencies and compile all .NET projects.
  - stage: Build
    displayName: Build
    jobs:
      - job: BuildProjects
        displayName: Restore and build projects
        steps:
          - task: UseDotNet@2
            displayName: Install .NET SDK
            inputs:
              packageType: sdk
              version: 8.x

          - task: DotNetCoreCLI@2
            displayName: Restore NuGet packages
            inputs:
              command: restore
              projects: '**/*.csproj'

          - task: DotNetCoreCLI@2
            displayName: Build projects
            inputs:
              command: build
              projects: '**/*.csproj'
              arguments: '--configuration $(buildConfiguration) --no-restore'

  # Stage agents are independent, so each browser job builds the test project,
  # installs its browser, and runs an isolated copy of the suite.
  - stage: Test
    displayName: Test
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: RunPlaywrightTests
        displayName: Run Playwright tests ($(PLAYWRIGHT_BROWSER))
        strategy:
          maxParallel: 3
          matrix:
            Chromium:
              PLAYWRIGHT_BROWSER: chromium
            Firefox:
              PLAYWRIGHT_BROWSER: firefox
            WebKit:
              PLAYWRIGHT_BROWSER: webkit
        steps:
          - task: UseDotNet@2
            displayName: Install .NET SDK
            inputs:
              packageType: sdk
              version: 8.x

          - task: DotNetCoreCLI@2
            displayName: Build test project
            inputs:
              command: build
              projects: 'src/tests/AI.Driven.QE.Framework.Tests.csproj'
              arguments: '--configuration $(buildConfiguration)'

          # Playwright's installer is generated in the test project's build output.
          - bash: |
              set -euo pipefail
              playwright_script="$(find "$(Build.SourcesDirectory)" \
                -path '*/bin/$(buildConfiguration)/net*/playwright.ps1' \
                -print -quit)"
              if [ -z "$playwright_script" ]; then
                echo "Could not find Playwright's generated playwright.ps1 installer."
                echo "Confirm the test project references Microsoft.Playwright."
                exit 1
              fi
              pwsh "$playwright_script" install --with-deps "$PLAYWRIGHT_BROWSER"
            displayName: Install $(PLAYWRIGHT_BROWSER) and dependencies
            env:
              PLAYWRIGHT_BROWSER: $(PLAYWRIGHT_BROWSER)

          # Ensure result and artifact targets exist even if setup fails before the first test.
          - bash: |
              mkdir -p "$(Build.SourcesDirectory)/src/tests/bin/$(buildConfiguration)/net8.0/allure-results"
              mkdir -p "$(Build.ArtifactStagingDirectory)/test-artifacts"
              mkdir -p "$(Build.ArtifactStagingDirectory)/allure-report"
              mkdir -p "$(Agent.TempDirectory)/TestResults"
            displayName: Prepare test artifact directories
            condition: always()

          # Save TRX results outside the source tree for reliable publication.
          - task: DotNetCoreCLI@2
            displayName: Run NUnit tests
            inputs:
              command: test
              projects: 'src/tests/AI.Driven.QE.Framework.Tests.csproj'
              publishTestResults: false
              arguments: >-
                --configuration $(buildConfiguration)
                --no-build
                --no-restore
                --logger "trx;LogFileName=playwright-tests.trx"
                --results-directory "$(Agent.TempDirectory)/TestResults"
            env:
              PLAYWRIGHT_BROWSER: $(PLAYWRIGHT_BROWSER)
              QE_ARTIFACTS_DIR: $(Build.ArtifactStagingDirectory)/test-artifacts

          # Publish test results even when a test fails.
          - task: PublishTestResults@2
            displayName: Publish test results
            condition: always()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '*.trx'
              searchFolder: '$(Agent.TempDirectory)/TestResults'
              failTaskOnFailedTests: true

          # Upload the TRX files separately for download from the pipeline run.
          - bash: |
              mkdir -p "$(Agent.TempDirectory)/TestResults"
              mkdir -p "$(Build.ArtifactStagingDirectory)/test-artifacts"
            displayName: Ensure artifact directories exist
            condition: always()

          - task: PublishPipelineArtifact@1
            displayName: Publish test results artifact
            condition: always()
            inputs:
              targetPath: '$(Agent.TempDirectory)/TestResults'
              artifact: test-results-$(PLAYWRIGHT_BROWSER)
              publishLocation: pipeline

          # Publish test screenshots and failure trace archives for review and debugging.
          - task: PublishPipelineArtifact@1
            displayName: Publish screenshots and failure traces
            condition: always()
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/test-artifacts'
              artifact: test-artifacts-$(PLAYWRIGHT_BROWSER)
              publishLocation: pipeline

          # Generate an HTML Allure report from results produced by the NUnit adapter.
          - bash: |
              set -euo pipefail
              npm install --global allure-commandline@2.46.1
              results_directory="$(find "$(Build.SourcesDirectory)/src/tests/bin/$(buildConfiguration)" \
                -type d -name allure-results -print -quit)"
              if [ -z "$results_directory" ] || \
                ! find "$results_directory" -maxdepth 1 -name '*-result.json' -print -quit | grep -q .; then
                echo "Allure results were not generated; check Allure.NUnit configuration and test output."
                exit 1
              fi
              printf 'Browser=%s\nFramework=.NET 8\nTarget=SauceDemo\n' \
                "$(PLAYWRIGHT_BROWSER)" > "$results_directory/environment.properties"
              allure generate "$results_directory" \
                --clean \
                --output "$(Build.ArtifactStagingDirectory)/allure-report"
            displayName: Generate Allure report ($(PLAYWRIGHT_BROWSER))
            condition: always()

          # Publish raw Allure result files for report regeneration or trend aggregation.
          - task: PublishPipelineArtifact@1
            displayName: Publish Allure results
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)/src/tests/bin/$(buildConfiguration)/net8.0/allure-results'
              artifact: allure-results-$(PLAYWRIGHT_BROWSER)
              publishLocation: pipeline

          # Upload the generated Allure HTML report as a downloadable pipeline artifact.
          - task: PublishPipelineArtifact@1
            displayName: Publish Allure report ($(PLAYWRIGHT_BROWSER))
            condition: always()
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/allure-report'
              artifact: allure-report-$(PLAYWRIGHT_BROWSER)
              publishLocation: pipeline
